services:
  chatterbox:
    image: chatterbox:dev
    build:
      context: .
      dockerfile: ./Dockerfile
      target: build
    command: yarn start:dev
    init: true
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${WEBSOCKET_PORT:-3001}:${WEBSOCKET_PORT:-3001}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - POSTGRES_HOST=postgres-chatterbox
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis-chatterbox
      - REDIS_PORT=6379
    depends_on:
      postgres-chatterbox:
        condition: service_healthy
      redis-chatterbox:
        condition: service_healthy
    networks:
      - chatterbox_net

  postgres-chatterbox:
    image: postgres:18-alpine
    container_name: postgres-chatterbox
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-chatterbox}
    ports:
      - "7352:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chatterbox_net

  redis-chatterbox:
    image: redis:8-alpine
    container_name: redis-chatterbox
    restart: unless-stopped
    ports:
      - "7369:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chatterbox_net

volumes:
  postgres_data:
    name: chatterbox_postgres_data
  redis_data:
    name: chatterbox_redis_data

networks:
  chatterbox_net:
    driver: bridge